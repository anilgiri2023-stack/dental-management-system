services:
  # 1. Backend Web Service (Node.js API)
  - type: web
    name: dental-management-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        fromService:
          type: web
          name: dental-management-frontend
          envVarKey: RENDER_EXTERNAL_URL
      # These must be set manually in the Render Dashboard
      - key: MONGO_URI
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # 2. Frontend Static Site (Vite React SPA)
  - type: web
    name: dental-management-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback routing: Redirect all requests to index.html so React Router handles them
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dental-management-backend
          envVarKey: RENDER_EXTERNAL_URL
      # Must be set manually if used in frontend
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
